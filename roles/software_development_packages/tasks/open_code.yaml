- name: Install OPEN CODE CLI
  ansible.builtin.shell: |
    curl -fsSL https://opencode.ai/install | bash
  args:
    executable: /bin/bash
    creates: "/home/{{ ansible_user }}/.opencode/bin/opencode"
  become: false
  ignore_errors: true
  environment:
    HOME: "/home/{{ ansible_user }}"
    USER: "{{ ansible_user }}"
