- name: Install fnm (Fast Node Manager)
  ansible.builtin.shell: |
    curl -fsSL https://fnm.vercel.app/install | bash
  args:
    executable: /bin/bash
    creates: /home/{{ ansible_user }}/.local/share/fnm/fnm
  become: true
  environment:
    HOME: "/home/{{ ansible_user }}"
    USER: "{{ ansible_user }}"
